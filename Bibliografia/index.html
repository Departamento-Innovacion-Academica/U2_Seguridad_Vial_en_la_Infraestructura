<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Geométrico, Seguridad Vial e Infraestructura de Transporte - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #27728F; 
            --accent-bright: #5cd3ff; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(39, 114, 143, 0.4);
            --text-main: #ffffff;
            --text-dim: #d4f2ff;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #031017;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #020a0e; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #0d3849 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        /* Animaciones de entrada de impacto */
        @keyframes impactEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes headerEntry {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-instruction, .main-header {
            animation: headerEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(39, 114, 143, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; animation-delay: 0.15s; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
            opacity: 0;
            animation: impactEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .card:hover { 
            border-color: var(--accent-bright); 
            transform: translateY(-5px); 
            background: rgba(39, 114, 143, 0.12); 
            box-shadow: 0 10px 20px rgba(39, 114, 143, 0.25); 
        }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(39, 114, 143, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        🛣️ <b>Instrucción de Navegación:</b> Consulta las referencias especializadas sobre diseño geométrico de carreteras, seguridad vial, normativas internacionales e infraestructura de transporte.
    </div>

    <header class="main-header">
        <h1>BIBLIOGRAFÍA</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Agency Transportation Engineering (2020)", t: "Design Vehicles and Truck Accommodations", f: "Military Surface Deployment and Distribution Command", u: "https://www.sddc.army.mil/sites/TEA/Functions/SpecialAssistant/TrafficEngineeringBranch/Bulletins/Bulletin%2020-02%20-%20Design%20Vehicles%20and%20Truck%20Accommodations.pdf" },
            { a: "AASHTO (2010)", t: "Highway Safety Manual (HSM)", f: "American Association of State Highway and Transportation Officials" },
            { a: "AASHTO (2011)", t: "Roadside Design Guide (4th ed.)", f: "American Association of State Highway and Transportation Officials" },
            { a: "AASHTO (2018)", t: "A policy on geometric design of highways and streets (7th ed.)", f: "American Association of State Highway and Transportation Officials" },
            { a: "Asprilla, Y. (2011)", t: "Influencia de los elementos de la infraestructura en la seguridad vial de los usuarios de las carreteras interurbanas: Estudio de caso: carretera Medellín-Bogotá, Ruta 50", f: "Universidad de los Andes" },
            { a: "Basyouny, K., & Sayed, T. (2010)", t: "Full Bayes Approach to Before-and-After Safety Evaluation with Matched Comparisons: Case Study of Stop-Sign In-Fill Program", f: "Transportation Research Record, 1-8", u: "https://doi.org/10.3141/2148-01" },
            { a: "Cárdenas Grisales, J. (2013)", t: "Diseño geométrico de carreteras (2.ª ed.)", f: "Ecoe Ediciones" },
            { a: "Castro, M. et al. (s. f.)", t: "Operating Speed and Speed Differential for Highway Design Consistency", f: "Journal of Transportation Engineering, 137", u: "https://doi.org/10.1061/(ASCE)TE.1943-5436.000030" },
            { a: "Chicago Department of Transportation (2013)", t: "Complete Streets Chicago. Design Guidelines", f: "Chicago Department of Transportation" },
            { a: "Department of Transport and Main Roads (2001)", t: "Road planning and design manual", f: "Queensland, Australia" },
            { a: "Glennon, J., Neuman, T., & Leisch, J. (1985)", t: "Safety and Operational Considerations for Design of Rural Highway Curves", f: "Transportation Research" },
            { a: "Gregory, J., & Taylor, P. (2023)", t: "Roadway Vertical Alignments", f: "Continuing Education and Development, Inc." },
            { a: "Harwood, D., & Bauer, K. (2015)", t: "Effect of Stopping Sight Distance on Crashes at Crest Vertical Curves on Rural Two-Lane Highways", f: "Transportation Research Record, 45-53", u: "https://doi.org/10.3141/2486-06" },
            { a: "Institute of Transportation Engineers (ITE) (2008)", t: "Urban Street Geometric Design Handbook", f: "ITE Washington" },
            { a: "INVIAS (2008)", t: "Manual de diseño geométrico de carreteras", f: "Instituto Nacional de Vías, Ministerio de Transporte" },
            { a: "iRAP (2022a)", t: "Coding Manual Drive on the left edition (5.3 ed.)", f: "International Road Assessment Programme" },
            { a: "iRAP (2022b)", t: "Road Safety Toolkit", f: "International Road Assessment Programme", u: "https://toolkit.irap.org/" },
            { a: "iRAP (2021)", t: "iRAP Official Portal", f: "International Road Assessment Programme", u: "https://irap.org/" },
            { a: "Jiménez, E. (2009)", t: "Diseño geométrico de vías. Capítulo 2: Controles para el diseño geométrico", f: "Universidad de Ibagué", u: "https://doblevia.wordpress.com/wp-content/uploads/2007/02/2545-cap2.pdf" },
            { a: "Lamm, R., Psarianos, B., & Mailaender, T. (1999)", t: "Highway Design and Traffic Safety Engineering Handbook", f: "McGraw-Hill Professional", u: "https://www.mdt.mt.gov/other/webdata/external/cadd/RDM/50-RDM-COMPLETE.pdf" },
            { a: "Ministerio de Transportes y Comunicaciones del Perú (2018)", t: "Manual de Diseño Geométrico de Carreteras", f: "MTC Perú" },
            { a: "Ministerio de Transportes y Movilidad Sostenible (2023)", t: "Guía de recomendaciones para el diseño de infraestructura ciclista", f: "Gobierno de España" },
            { a: "NACTO (2013)", t: "Urban Street Design Guide", f: "National Association of City Transportation Officials" },
            { a: "NACTO (2016)", t: "Global Street Design Guide (1.ª ed.)", f: "National Association of City Transportation Officials" },
            { a: "Navarro, S. (2011)", t: "Diseño y Cálculo Geométrico de Viales - Alineamiento Vertical", f: "Universidad Nacional de Ingeniería, Nicaragua" },
            { a: "Posada, J., Cadavid, S., & Castro, L. (2014)", t: "Consistencia en el diseño. Predicción de la velocidad de operación en carreteras", f: "Ingeniería Solidaria, 10, 39-47", u: "https://doi.org/10.16925/in.v9i17.803" },
            { a: "Secretaría de Estado de Obras Públicas y Comunicaciones (1982)", t: "Criterios Básicos para el Diseño Geométrico de Carreteras", f: "República Dominicana" },
            { a: "SEICA (2011)", t: "Manual Centroamericano de Normas para el Diseño Geométrico de Carreteras con enfoque de Gestión de Riesgo y Seguridad Vial (3.ª ed.)", f: "Secretaría de Integración Económica Centroamericana" },
            { a: "Texas Transportation Institute (2010)", t: "Guide for Geometric Design and Operational Factors That Impact Truck Use of Toll Roads", f: "Texas Transportation Institute" },
            { a: "Transportation Research Board (TRB) (2022)", t: "Highway Capacity Manual 7th Edition: A Guide for Multimodal Mobility Analysis", f: "The National Academies Press" },
            { a: "Turner, B. M. et al. (2024)", t: "Guide for Safe Speeds: Managing Traffic Speeds to Save Lives and Improve Livability", f: "World Bank Group", u: "https://doi.org/1596/41240" },
            { a: "World Road Association (PIARC) (2016)", t: "Road Safety Manual", f: "PIARC", u: "https://roadsafety.piarc.org/es/planificacion-diseno-y-explotacion/8-diseno-para-usuarios-de-la-carretera" },
            { a: "Zegeer, C. et al. (1992)", t: "Safety Effects of Geometric Improvements on Horizontal Curves", f: "Transportation Research Record, 11-19" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.style.animationDelay = `${0.25 + (index * 0.04)}s`;
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
